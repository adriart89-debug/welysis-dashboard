<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Welysis · hanson*</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f0e;
    --bg-2: #161716;
    --bg-3: #1f201f;
    --line: #2a2b2a;
    --line-2: #383938;
    --ink: #f4efe6;
    --ink-dim: #b8b3aa;
    --ink-mute: #7a766f;
    --cream: #ece4d3;
    --accent: #f24b3b;
    --accent-ink: #fff4f0;
    --ok: #c8e87a;
    --warn: #ffb84d;
    --late: #f24b3b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Archivo', system-ui, sans-serif;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  /* ─── TOPBAR ─── */
  .topbar {
    border-bottom: 1px solid var(--line);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 24px;
    position: sticky; top: 0; z-index: 50;
    background: rgba(14,15,14,0.92);
    backdrop-filter: blur(14px);
  }
  .brand { display: flex; align-items: baseline; gap: 2px; font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
  .brand .star { color: var(--accent); font-size: 26px; line-height: 0; transform: translateY(2px); display: inline-block; }
  .brand .dot { color: var(--ink-mute); margin: 0 10px; font-weight: 400; }
  .client { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .topbar .spacer { flex: 1; }
  .meta {
    display: flex; gap: 22px; align-items: center;
    font-size: 12px; color: var(--ink-dim);
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .meta b { color: var(--ink); font-weight: 600; }
  .live-dot {
    width: 7px; height: 7px; border-radius: 999px; background: var(--ok);
    display: inline-block; margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(200,232,122,0.5); }
    70%  { box-shadow: 0 0 0 8px rgba(200,232,122,0); }
    100% { box-shadow: 0 0 0 0 rgba(200,232,122,0); }
  }

  /* ─── HERO ─── */
  .hero {
    padding: 42px 32px 18px;
    display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px;
    border-bottom: 1px solid var(--line);
  }
  .hero h1 {
    font-size: clamp(36px, 4.4vw, 58px);
    line-height: 1.02; letter-spacing: -0.035em;
    font-weight: 800; margin: 0 0 22px 0;
  }
  .hero h1 .row { display: block; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero h1 .ast { color: var(--accent); font-weight: 800; }
  .hero p { margin: 0; max-width: 56ch; color: var(--ink-dim); font-size: 15px; line-height: 1.55; }
  .hero-side { display: flex; flex-direction: column; gap: 12px; align-self: end; }
  .pill-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    padding: 7px 12px; border: 1px solid var(--line-2); border-radius: 999px;
    font-size: 11px; font-family: 'JetBrains Mono', monospace;
    color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.06em;
  }
  .pill.solid { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .pill.cream { background: var(--cream); color: #1a1a1a; border-color: var(--cream); }

  /* ─── TABS ─── */
  .tabs {
    display: flex; gap: 4px;
    padding: 0 32px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    position: sticky; top: 65px; z-index: 40;
    backdrop-filter: blur(14px);
  }
  .tab {
    padding: 16px 22px 14px; font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
    color: var(--ink-mute); cursor: pointer;
    border: none; background: transparent;
    font-family: 'Archivo', sans-serif;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    display: flex; align-items: center; gap: 8px; transition: color .15s;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tab .tab-count {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--ink-mute); background: var(--bg-3); padding: 2px 6px; border-radius: 999px;
  }
  .tab.active .tab-count { color: var(--accent); background: rgba(242,75,59,0.12); }

  /* ─── SECTIONS ─── */
  .section { padding: 36px 32px; border-bottom: 1px solid var(--line); }
  .section-head {
    display: flex; align-items: end; justify-content: space-between;
    margin-bottom: 24px; gap: 24px;
  }
  .section-head h2 {
    margin: 0; font-size: 13px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-dim);
    display: flex; align-items: baseline; gap: 10px;
  }
  .section-head h2 .num { font-family: 'JetBrains Mono', monospace; color: var(--ink-mute); font-weight: 500; }
  .section-head .sub { font-size: 13px; color: var(--ink-mute); max-width: 50ch; text-align: right; line-height: 1.45; }

  /* ─── INFORME IA ─── */
  .informe-ia {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .informe-ia-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px;
  }
  .ia-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 999px;
    font-size: 10px; font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.06em;
    background: rgba(242,75,59,0.12); color: var(--accent);
    border: 1px solid rgba(242,75,59,0.3);
  }
  .ia-badge::before { content: '✦'; }
  .informe-ia-title {
    font-size: 15px; font-weight: 700; letter-spacing: -0.01em;
  }
  .informe-ia-meta {
    margin-left: auto; font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.06em;
  }
  .informe-ia-body {
    padding: 24px;
    font-size: 15px; line-height: 1.7; color: var(--ink-dim);
    max-width: 80ch;
  }
  .informe-ia-body p { margin: 0 0 14px 0; }
  .informe-ia-body p:last-child { margin-bottom: 0; }
  .informe-ia-body strong { color: var(--ink); font-weight: 700; }

  /* ─── GOALS ─── */
  .goals-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .goal {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 20px; display: flex; flex-direction: column; gap: 12px;
    position: relative; overflow: hidden;
  }
  .goal-head { display: flex; justify-content: space-between; align-items: baseline; }
  .goal-name { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; text-transform: lowercase; }
  .goal-pct {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600;
    color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.06em;
  }
  .goal-numbers { display: flex; align-items: baseline; gap: 8px; }
  .goal-current { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-feature-settings: "tnum"; }
  .goal-sep { color: var(--ink-mute); font-size: 18px; font-weight: 300; }
  .goal-target { font-size: 18px; font-weight: 500; color: var(--ink-mute); font-feature-settings: "tnum"; }
  .goal-bar { width: 100%; height: 6px; background: var(--bg-3); border-radius: 3px; overflow: hidden; }
  .goal-bar > span {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--accent), #ff7a5a);
    transition: width .6s cubic-bezier(.2,.8,.2,1); border-radius: 3px;
  }
  .goal.done .goal-bar > span { background: linear-gradient(90deg, var(--ok), #d8f08a); }
  .goal-foot {
    display: flex; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.06em;
  }
  .goal-foot .gap-num { color: var(--ink); }
  .goal.done .gap-num { color: var(--ok); }

  /* ─── KPIS ─── */
  .kpis {
    display: grid; gap: 1px; background: var(--line);
    border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
  }
  .kpi {
    background: var(--bg-2); padding: 22px 22px 24px;
    display: flex; flex-direction: column; gap: 14px;
    transition: background .18s; cursor: default; min-height: 200px;
  }
  .kpi:hover { background: var(--bg-3); }
  .kpi-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: var(--ink-mute);
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .kpi-head .ico {
    width: 22px; height: 22px; border: 1px solid var(--line-2); border-radius: 4px;
    display: grid; place-items: center; color: var(--ink-dim); font-size: 11px;
  }
  .kpi-value { font-size: 40px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; font-feature-settings: "tnum"; }
  .kpi-delta { display: flex; align-items: center; gap: 6px; font-size: 12px; font-family: 'JetBrains Mono', monospace; }
  .kpi-delta.up { color: var(--ok); }
  .kpi-delta.down { color: var(--accent); }
  .kpi-delta.flat { color: var(--ink-mute); }
  .kpi-delta .arrow { font-weight: 700; }
  .kpi-delta .vs { color: var(--ink-mute); margin-left: 4px; }
  .kpi-spark { margin-top: auto; height: 36px; width: 100%; }

  /* ─── CHARTS ─── */
  .charts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .chart { background: var(--bg-2); padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 14px; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; }
  .chart-title { font-size: 16px; font-weight: 700; letter-spacing: -0.015em; }
  .chart-meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.06em; }
  .chart-canvas { height: 200px; width: 100%; }
  .chart-legend { display: flex; gap: 18px; font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .chart-legend .swatch { width: 9px; height: 9px; display: inline-block; margin-right: 6px; vertical-align: middle; border-radius: 2px; }

  /* ─── TOP POSTS / KEYWORDS TABLE ─── */
  .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .data-table thead th {
    text-align: left; font-weight: 600; padding: 10px 14px;
    font-size: 11px; color: var(--ink-mute);
    font-family: 'JetBrains Mono', monospace; text-transform: uppercase;
    letter-spacing: 0.08em; border-bottom: 1px solid var(--line);
  }
  .data-table thead th:not(:first-child) { text-align: right; }
  .data-table tbody tr { border-bottom: 1px solid var(--line); transition: background .12s; }
  .data-table tbody tr:last-child { border-bottom: none; }
  .data-table tbody tr:hover { background: var(--bg-2); }
  .data-table td { padding: 13px 14px; vertical-align: middle; }
  .data-table td:not(:first-child) { text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--ink-dim); }
  .data-table td.kw-pos { font-weight: 700; }
  .data-table td.kw-pos.top { color: var(--ok); }
  .data-table td.kw-pos.mid { color: var(--warn); }
  .data-table td.kw-pos.low { color: var(--ink-mute); }
  .post-title { font-weight: 600; letter-spacing: -0.01em; }
  .post-date { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-mute); margin-top: 3px; }

  /* ─── PROJECTS ─── */
  .projects-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .projects-table thead th {
    text-align: left; font-weight: 600; padding: 10px 14px;
    font-size: 11px; color: var(--ink-mute);
    font-family: 'JetBrains Mono', monospace; text-transform: uppercase;
    letter-spacing: 0.08em; border-bottom: 1px solid var(--line);
  }
  .projects-table tbody tr { border-bottom: 1px solid var(--line); transition: background .12s; }
  .projects-table tbody tr:hover { background: var(--bg-2); }
  .projects-table td { padding: 14px; vertical-align: middle; }
  .projects-table td.proj-name { font-weight: 600; letter-spacing: -0.01em; }
  .projects-table td.proj-name .small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-mute); margin-top: 3px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.06em;
    border: 1px solid transparent;
  }
  .badge .blob { width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
  .badge.proceso  { background: rgba(200,232,122,0.12); color: var(--ok);     border-color: rgba(200,232,122,0.25); }
  .badge.retraso  { background: rgba(242,75,59,0.14);  color: var(--accent); border-color: rgba(242,75,59,0.3); }
  .badge.pendiente{ background: rgba(184,179,170,0.1); color: var(--ink-dim); border-color: rgba(184,179,170,0.2); }
  .badge.hecho    { background: rgba(236,228,211,0.1); color: var(--cream);  border-color: rgba(236,228,211,0.2); }
  .progress-bar { width: 100%; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress-bar > span { display: block; height: 100%; background: var(--accent); }

  /* ─── MARQUEE ─── */
  .marquee {
    overflow: hidden; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    background: var(--bg-2); color: var(--accent);
    padding: 16px 0; white-space: nowrap;
  }
  .marquee-track { display: inline-flex; align-items: center; gap: 32px; animation: scroll 24s linear infinite; padding-left: 32px; }
  .marquee .ast { color: var(--accent); font-size: 52px; font-weight: 900; line-height: 1; display: inline-block; transform: translateY(2px); }
  .marquee .hs { font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-dim); font-family: 'JetBrains Mono', monospace; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* ─── FOOTER ─── */
  .footer {
    padding: 30px 32px 60px; color: var(--ink-mute); font-size: 12px;
    display: flex; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em;
  }

  /* ─── LOADING STATE ─── */
  .loading {
    display: flex; align-items: center; justify-content: center;
    min-height: 60vh; flex-direction: column; gap: 16px;
  }
  .loading-ring {
    width: 40px; height: 40px; border: 2px solid var(--line);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-txt { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.08em; }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 1100px) {
    .kpis { grid-template-columns: repeat(3, 1fr) !important; }
    .charts { grid-template-columns: 1fr; }
    .hero { grid-template-columns: 1fr; }
    .goals-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 700px) {
    .kpis { grid-template-columns: repeat(2, 1fr) !important; }
    .topbar { padding: 14px 18px; flex-wrap: wrap; }
    .section { padding: 24px 18px; }
    .hero { padding: 28px 18px; }
    .tabs { padding: 0 18px; overflow-x: auto; }
    .goals-grid { grid-template-columns: 1fr; }
  }


  /* ─── SELECTOR DE MES ─── */
  .month-selector {
    display: flex; align-items: center; gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .month-btn {
    padding: 5px 10px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--line-2); background: transparent;
    color: var(--ink-dim); font-family: 'JetBrains Mono', monospace;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    transition: all .15s;
  }
  .month-btn:hover { background: var(--bg-3); color: var(--ink); }
  .month-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .month-btn.no-data { opacity: 0.3; cursor: default; pointer-events: none; }
  .month-nav { color: var(--ink-mute); cursor: pointer; padding: 4px 8px; border: none;
    background: transparent; font-size: 16px; transition: color .15s; }
  .month-nav:hover { color: var(--ink); }

  /* SVG chart helpers */
  .axis-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.08em; }
  .grid-line { stroke: #2a2b2a; stroke-width: 1; stroke-dasharray: 2 3; }
  .y-tick { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--ink-mute); }
</style>
</head>
<body>

<div id="app"><div class="loading"><div class="loading-ring"></div><div class="loading-txt">cargando datos</div></div></div>

<script>
/* ══════════════════════════════════════════════
   CONFIG — ajusta solo esta sección en producción
   ══════════════════════════════════════════════ */
const DATA_URL = './data.json'; // en producción: '/data/welysis.json'

/* ══════════════════════════════════════════════
   CONSTANTES
   ══════════════════════════════════════════════ */
const MONTHS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const PRETTY = {
  seguidores:'seguidores', impresiones:'impresiones', visitantes:'visitantes',
  visualizaciones:'visualizaciones', reacciones:'reacciones', comentarios:'comentarios',
  impresiones_organicas:'impresiones orgánicas', clics_organicos:'clics orgánicos',
  posicion_media:'posición media', formularios:'formularios enviados',
  eventos:'eventos interacción', keywords_top10:'keywords top 10',
  sesiones:'sesiones orgánicas', backlinks:'backlinks'
};
const ICONS = {
  seguidores:'◐', impresiones:'◑', visitantes:'◉', visualizaciones:'▣',
  reacciones:'✱', comentarios:'◇', sesiones:'△', posicion_media:'⤴',
  backlinks:'∞', keywords_top10:'#'
};

/* ══════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════ */
let DATA        = null;
let activeMonth = null;
let activeTab = 'rrss';

/* ══════════════════════════════════════════════
   LOAD DATA
   ══════════════════════════════════════════════ */
async function loadData() {
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    DATA = await res.json();
    render();
  } catch(e) {
    document.getElementById('app').innerHTML = `
      <div class="loading">
        <div style="font-size:32px; color:var(--accent)">⚠</div>
        <div class="loading-txt">no se pudo cargar data.json</div>
        <div style="font-size:12px;color:var(--ink-mute);margin-top:8px;font-family:'JetBrains Mono',monospace">${e.message}</div>
      </div>`;
  }
}

/* ══════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════ */
const fmt = n => {
  if (n === null || n === undefined) return '—';
  const num = Number(n);
  if (isNaN(num)) return n;
  return num.toLocaleString('es-ES');
};
const last = arr => {
  for (let i = arr.length - 1; i >= 0; i--)
    if (arr[i] !== null && arr[i] !== undefined) return { v: arr[i], i };
  return { v: null, i: -1 };
};
const delta = arr => {
  const l = last(arr);
  if (l.i <= 0) return { pct: null, dir: 'flat', diff: 0 };
  let prev = null;
  for (let i = l.i - 1; i >= 0; i--)
    if (arr[i] !== null && arr[i] !== undefined) { prev = arr[i]; break; }
  if (prev === null || prev === 0) return { pct: null, dir: 'flat', diff: 0 };
  const diff = l.v - prev;
  const pct = (diff / prev) * 100;
  return { pct, dir: pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat', diff };
};
function parseMarkdown(text) {
  if (!text) return '';
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .split('\n\n')
    .map(p => `<p>${p.trim()}</p>`)
    .join('');
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' });
}

/* ══════════════════════════════════════════════
   SVG CHARTS
   ══════════════════════════════════════════════ */
function sparkline(values, color, w=160, h=36) {
  const valid = values.map((v,i) => ({v,i})).filter(d => d.v !== null && d.v !== undefined);
  if (valid.length < 2) {
    return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="#2a2b2a" stroke-dasharray="3 3"/>
    </svg>`;
  }
  const max = Math.max(...valid.map(d=>d.v));
  const min = Math.min(...valid.map(d=>d.v));
  const range = max - min || 1;
  const xStep = w / (values.length - 1);
  const pts = valid.map(d => {
    const x = d.i * xStep;
    const y = h - 4 - ((d.v - min) / range) * (h - 8);
    return [x, y];
  });
  const path = pts.map((p,i) => (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const areaPath = path + ` L ${pts[pts.length-1][0]},${h} L ${pts[0][0]},${h} Z`;
  const lastPt = pts[pts.length-1];
  const cid = color.replace('#','');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="sg${cid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${areaPath}" fill="url(#sg${cid})"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="2.5" fill="${color}"/>
  </svg>`;
}

function bigChart(key, metric, area) {
  const w=600, h=200, padL=44, padR=16, padT=18, padB=26;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const values = metric.values;
  const valid = values.filter(v => v !== null && v !== undefined);
  if (!valid.length) {
    return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}"><text x="${w/2}" y="${h/2}" text-anchor="middle" class="axis-label">sin datos todavía</text></svg>`;
  }
  const max = Math.max(...valid);
  const min = Math.min(0, Math.min(...valid));
  const range = max - min || 1;
  const xStep = innerW / (values.length - 1);
  const yScale = v => padT + innerH - ((v - min) / range) * innerH;

  let grid = '', yTicks = '';
  for (let i = 0; i <= 3; i++) {
    const y = padT + (innerH / 3) * i;
    const val = max - (range / 3) * i;
    grid  += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" class="grid-line"/>`;
    yTicks += `<text x="${padL-6}" y="${y+3}" text-anchor="end" class="y-tick">${Math.round(val).toLocaleString('es-ES')}</text>`;
  }

  let xLabels = '';
  values.forEach((v,i) => {
    const x = padL + i * xStep;
    xLabels += `<text x="${x}" y="${h-8}" text-anchor="middle" class="axis-label">${MONTHS[i]}</text>`;
  });

  const pts = values.map((v,i) => v===null||v===undefined ? null : [padL+i*xStep, yScale(v)]).filter(Boolean);
  const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaPath = pts.length ? path + ` L ${pts[pts.length-1][0]},${padT+innerH} L ${pts[0][0]},${padT+innerH} Z` : '';
  const c = metric.color;
  const gid = `bg-${area}-${key}`;

  let dots = '';
  values.forEach((v,i) => {
    if (v === null || v === undefined) return;
    const x = padL + i*xStep, y = yScale(v);
    dots += `<circle cx="${x}" cy="${y}" r="3.5" fill="${c}" stroke="#161716" stroke-width="1.5"/>`;
    dots += `<text x="${x}" y="${y-10}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#f4efe6">${fmt(v)}</text>`;
  });

  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${c}" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="${c}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${grid}${yTicks}${xLabels}
    ${areaPath ? `<path d="${areaPath}" fill="url(#${gid})"/>` : ''}
    ${path ? `<path d="${path}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
    ${dots}
  </svg>`;
}

/* ══════════════════════════════════════════════
   COMPONENT BUILDERS
   ══════════════════════════════════════════════ */
function goalCard(key, g) {
  // Si no tiene target, mostrar solo el número (SEO)
  if (!g.target) {
    const inv = g.invert;
    return `
    <div class="goal">
      <div class="goal-head">
        <div class="goal-name">${PRETTY[key]||key}</div>
        <div class="goal-pct" style="color:var(--ink-mute);font-size:10px">${inv?'↓ mejor':'↑ mejor'}</div>
      </div>
      <div class="goal-numbers">
        <span class="goal-current">${fmt(g.current)}</span>
      </div>
      <div class="goal-foot" style="margin-top:8px">
        <span>seguimiento mensual</span>
        <span style="color:var(--ink-mute)">sin objetivo fijo</span>
      </div>
    </div>`;
  }

  const inv = g.invert;
  let pct;
  if (inv) {
    pct = g.current <= g.target ? 100 : (g.target / g.current) * 100;
  } else {
    pct = g.target ? (g.current / g.target) * 100 : 0;
  }
  pct = Math.max(0, Math.min(100, pct));
  const done = pct >= 100;
  const gap = inv ? (g.current - g.target) : (g.target - g.current);
  return `
    <div class="goal ${done?'done':''}">
      <div class="goal-head">
        <div class="goal-name">${PRETTY[key]||key}</div>
        <div class="goal-pct">${pct.toFixed(0)}%</div>
      </div>
      <div class="goal-numbers">
        <span class="goal-current">${fmt(g.current)}</span>
        <span class="goal-sep">/</span>
        <span class="goal-target">${fmt(g.target)}</span>
      </div>
      <div class="goal-bar"><span style="width:${pct}%"></span></div>
      <div class="goal-foot">
        <span>${inv?'objetivo · bajar':'objetivo anual'}</span>
        <span>${done?'✓ conseguido':`faltan <span class="gap-num">${fmt(Math.abs(gap))}</span>`}</span>
      </div>
    </div>`;
}

function kpiCard(key, m) {
  const cur = last(m.values);
  const d = delta(m.values);
  const arrow = d.dir==='up' ? '↑' : d.dir==='down' ? '↓' : '·';
  const pctTxt = d.pct===null ? '—' : (Math.abs(d.pct).toFixed(1) + '%');
  return `
    <div class="kpi">
      <div class="kpi-head">
        <span>${PRETTY[key]||key}</span>
        <span class="ico">${ICONS[key]||'☆'}</span>
      </div>
      <div class="kpi-value">${fmt(cur.v)}</div>
      <div class="kpi-delta ${d.dir}">
        <span class="arrow">${arrow}</span>
        <span>${pctTxt}</span>
        <span class="vs">vs ${cur.i>0 ? MONTHS[cur.i-1].toLowerCase() : '—'}</span>
      </div>
      <div class="kpi-spark">${sparkline(m.values, m.color)}</div>
    </div>`;
}

function chartCard(key, m, area) {
  const d = delta(m.values);
  const arrow = d.dir==='up'?'↑':d.dir==='down'?'↓':'·';
  return `
    <div class="chart">
      <div class="chart-head">
        <div class="chart-title">${PRETTY[key]||key}</div>
        <div class="chart-meta"><span class="kpi-delta ${d.dir}" style="display:inline-flex">${arrow} ${d.pct===null?'—':Math.abs(d.pct).toFixed(1)+'%'} vs mes anterior</span></div>
      </div>
      <div class="chart-canvas">${bigChart(key, m, area)}</div>
      <div class="chart-legend">
        <span><span class="swatch" style="background:${m.color}"></span>${PRETTY[key]||key} ${DATA.meta.period}</span>
        <span style="margin-left:auto">total · ${fmt(m.values.reduce((a,b)=>a+(b||0),0))}</span>
      </div>
    </div>`;
}

function projectRow(p) {
  const colors = { proceso:'var(--cream)', retraso:'var(--accent)', hecho:'var(--ok)', pendiente:'var(--ink-dim)' };
  return `
    <tr>
      <td class="proj-name">
        ${p.name}
        <span class="small">${p.note||''}</span>
      </td>
      <td><span class="badge ${p.status}"><span class="blob"></span>${p.status}</span></td>
      <td><span style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-dim)">${fmtDate(p.date)}</span></td>
      <td>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="progress-bar"><span style="width:${p.progress}%;background:${colors[p.status]||'var(--accent)'}"></span></div>
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-dim);min-width:32px;text-align:right">${p.progress}%</span>
        </div>
      </td>
    </tr>`;
}

function marqueeContent() {
  const unit = `<span class="ast">*</span><span class="hs">hanson style</span><span class="ast">*</span><span class="hs">hanson style</span><span class="ast">*</span><span class="hs">hanson style</span><span class="ast">*</span><span class="hs">hanson style</span><span class="ast">*</span><span class="hs">hanson style</span><span class="ast">*</span><span class="hs">hanson style</span>`;
  return unit + unit;
}

/* ══════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════ */

/* ══════════════════════════════════════════════
   RESOLVER DATOS DEL MES ACTIVO
   ══════════════════════════════════════════════ */
function getActiveMonthData() {
  const mes = activeMonth || DATA.meta.month_current;

  if (mes && DATA.historico?.[mes]) {
    const h = DATA.historico[mes];
    // Si el historico tiene informe con texto usarlo, si no usar el global
    const informeLi  = h.informe_ia?.linkedin || (mes === DATA.meta.month_current ? DATA.informe_ia?.linkedin : '');
    const informeSeo = h.informe_ia?.seo      || (mes === DATA.meta.month_current ? DATA.informe_ia?.seo      : '');
    return {
      linkedin:   h.linkedin || DATA.linkedin,
      seo:        h.seo      || DATA.seo,
      informe_ia: {
        linkedin: informeLi,
        seo:      informeSeo,
        generado: h.informe_ia?.generado || DATA.informe_ia?.generado,
      },
      label: h.label || DATA.meta.month_label,
    };
  }

  return {
    linkedin:   DATA.linkedin,
    seo:        DATA.seo,
    informe_ia: DATA.informe_ia,
    label:      DATA.meta.month_label,
  };
}

function buildMonthSelector() {
  const historico = DATA.historico || {};
  const meses = Object.keys(historico);
  if (meses.length === 0) return '';

  // El mes activo es el seleccionado, o el month_current por defecto
  const current = activeMonth || DATA.meta.month_current;

  const btns = meses.map(mes => {
    const isActive = mes === current;
    return `<button class="month-btn ${isActive ? 'active' : ''}" data-month="${mes}">${mes}</button>`;
  }).join('');

  return `<div class="month-selector">${btns}</div>`;
}

function render() {
  const monthData = getActiveMonthData();
  const isRrss  = activeTab === 'rrss';
  const metrics = isRrss ? monthData.linkedin.metrics : monthData.seo.metrics;
  const goals   = isRrss ? monthData.linkedin.goals   : monthData.seo.goals;
  const informe = isRrss ? monthData.informe_ia.linkedin : monthData.informe_ia.seo;
  const projects  = DATA.projects.filter(p => (p.area||'rrss') === activeTab);
  const rrssCount = DATA.projects.filter(p => (p.area||'rrss')==='rrss').length;
  const seoCount  = DATA.projects.filter(p => p.area==='seo').length;
  const genDate   = monthData.informe_ia?.generado ? fmtDate(monthData.informe_ia.generado.slice(0,10)) : '—';
  const nMetrics  = Object.keys(metrics).length;
  const monthLabel = monthData.label || DATA.meta.month_label;

  // Top posts / keywords table
  let extraTable = '';
  if (isRrss && DATA.linkedin.top_posts?.length) {
    extraTable = `
      <section class="section">
        <div class="section-head">
          <h2><span class="num">04</span> mejores publicaciones del mes</h2>
          <div class="sub">las piezas con más alcance. base para la estrategia del próximo mes.</div>
        </div>
        <table class="data-table">
          <thead><tr><th>publicación</th><th>impresiones</th><th>reacciones</th><th>comentarios</th></tr></thead>
          <tbody>
            ${DATA.linkedin.top_posts.map(p=>`
              <tr>
                <td><div class="post-title">${p.title}</div><div class="post-date">${fmtDate(p.date)}</div></td>
                <td>${fmt(p.impressions)}</td>
                <td>${fmt(p.reactions)}</td>
                <td>${fmt(p.comments)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </section>`;
  } else if (!isRrss && DATA.seo.top_keywords?.length) {
    extraTable = `
      <section class="section">
        <div class="section-head">
          <h2><span class="num">04</span> keywords principales</h2>
          <div class="sub">posicionamiento actual de los términos clave. posición 1–10 = top 10 de google.</div>
        </div>
        <table class="data-table">
          <thead><tr><th>keyword</th><th>posición</th><th>vol. mensual</th></tr></thead>
          <tbody>
            ${DATA.seo.top_keywords.map(k=>{
              const cls = k.position<=3?'top':k.position<=10?'mid':'low';
              return `<tr><td>${k.keyword}</td><td class="kw-pos ${cls}">#${k.position}</td><td>${fmt(k.volume)}</td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </section>`;
  }

  document.getElementById('app').innerHTML = `
    <header class="topbar">
      <div class="brand">hanson<span class="star">*</span></div>
      <div class="client">cliente · <b>${DATA.meta.client}</b></div>
      <div class="spacer"></div>
      <div class="meta">
        ${buildMonthSelector()}
        <span>actualizado · <b>${fmtDate(DATA.meta.updated)}</b></span>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab ${isRrss?'active':''}" data-tab="rrss">linkedin <span class="tab-count">${rrssCount}</span></button>
      <button class="tab ${!isRrss?'active':''}" data-tab="seo">seo <span class="tab-count">${seoCount}</span></button>
    </nav>

    <section class="hero">
      <div>
        <h1>
          <span class="row" style="font-size: clamp(52px,6vw,80px); letter-spacing:-0.04em"><em>${DATA.meta.client}</em><span class="ast">*</span></span>
          <span class="row" style="font-size: clamp(22px,2.8vw,36px); font-weight:600; color:var(--ink); letter-spacing:-0.02em; margin-top:6px; display:block">${monthLabel}.</span>
          <span class="row hero-tagline" style="font-size: clamp(14px,1.6vw,20px); font-weight:600; color:var(--accent); letter-spacing:-0.01em; margin-top:10px; display:block">${isRrss ? DATA.meta.tagline_linkedin || 'los números no mienten, pero sí se maquillan*' : DATA.meta.tagline_seo || 'google te quiere, pero hay que currárselo*'}</span>
        </h1>
        <p style="margin-top:20px">${isRrss
          ? 'objetivos, números y gráficas de linkedin. todo en un sitio. si cambia algo al mes que viene este dashboard se actualiza solo.'
          : 'sesiones orgánicas, posiciones, backlinks. lo que de verdad mete tráfico desde google. nada de vanity metrics.'
        }</p>
      </div>
      <div class="hero-side">
        <div class="pill-row">
          ${isRrss
            ? `<span class="pill solid">linkedin · activo</span><span class="pill cream">fuente · metricool</span>`
            : `<span class="pill solid">search console · activo</span><span class="pill">ahrefs · activo</span>`
          }
        </div>
      </div>
    </section>

    <!-- 01 INFORME DEL MES -->
    <section class="section">
      <div class="section-head">
        <h2><span class="num">01</span> informe del mes</h2>
        <div class="sub">actualizado cada mes. los datos mandan.</div>
      </div>
      <div class="informe-ia">
        <div class="informe-ia-header">
          <span class="informe-ia-title">${isRrss?'linkedin':'seo'} · ${monthLabel}</span>
          <span class="informe-ia-meta">actualizado · ${genDate}</span>
        </div>
        <div class="informe-ia-body">${parseMarkdown(informe)}</div>
      </div>
    </section>

    <!-- 02 OBJETIVOS -->
    <section class="section">
      <div class="section-head">
        <h2><span class="num">02</span> objetivos ${DATA.meta.period}</h2>
        <div class="sub">dónde estamos vs dónde queremos llegar.</div>
      </div>
      <div class="goals-grid">
        ${Object.keys(goals).map(k => goalCard(k, goals[k])).join('')}
      </div>
    </section>

    <!-- 03 KPIs -->
    <section class="section">
      <div class="section-head">
        <h2><span class="num">03</span> kpis del mes</h2>
        <div class="sub">números clave. el delta compara con el mes anterior.</div>
      </div>
      <div class="kpis" style="grid-template-columns: repeat(${nMetrics}, 1fr)">
        ${Object.keys(metrics).map(k => kpiCard(k, metrics[k])).join('')}
      </div>
    </section>

    <!-- MARQUEE -->
    <div class="marquee">
      <div class="marquee-track">
        ${marqueeContent()}
      </div>
    </div>

    <!-- GRÁFICAS -->
    <section class="section">
      <div class="section-head">
        <h2><span class="num">${isRrss?'':''}${extraTable?'05':'04'} evolución mensual</h2>
        <div class="sub">cómo se mueven las métricas a lo largo del año.</div>
      </div>
      <div class="charts">
        ${Object.keys(metrics).map(k => chartCard(k, metrics[k], activeTab)).join('')}
      </div>
    </section>

    <!-- TOP POSTS / KEYWORDS -->
    ${extraTable}

    <footer class="footer">
      <div>hanson<span style="color:var(--accent)">*</span> · agencia de publicidad leal</div>
      <div>actualizado automáticamente · ${DATA.meta.updated}</div>
    </footer>
  `;

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      activeTab = t.dataset.tab;
      // NO resetear activeMonth al cambiar de tab
      render();
    });
  });

  // Selector de mes
  document.querySelectorAll('.month-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeMonth = btn.dataset.month;
      render();
    });
  });
}

loadData();
</script>
</body>
</html>
